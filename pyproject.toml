[project]
name = "dizx"
version = "0.1.0"
description = "Distributed quantum error correction from syndrome extraction ZX diagrams"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "stim>=1.15",
    "sinter>=1.15.0,<2.0.0",
    "numpy",
    "networkx",
    "matplotlib",
    "pyyaml>=6.0,<7.0",
    "scipy",
    # The edge-reweighting fork (github.com/felix-burt/PyMatching) makes the
    # heralded decoder much faster (see dizx.sinter_decoders). Poetry installs
    # it by default; `poetry install -E stock-pymatching` takes PyPI's instead.
    # Wheel metadata (pip installs) asks for stock pymatching.
    "pymatching>=2.2",
]

[project.optional-dependencies]
stock-pymatching = []

[tool.poetry.dependencies]
pymatching = [
    { url = "https://github.com/felix-burt/PyMatching/releases/download/v2.4.0-reweight1/pymatching-2.4.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", markers = "extra != 'stock-pymatching' and sys_platform == 'linux'" },
    { url = "https://github.com/felix-burt/PyMatching/releases/download/v2.4.0-reweight1/pymatching-2.4.0-cp312-cp312-macosx_11_0_arm64.whl", markers = "extra != 'stock-pymatching' and sys_platform == 'darwin'" },
    { version = ">=2.2", markers = "extra == 'stock-pymatching'" },
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel",
    "ipympl (>=0.10.0,<0.11.0)",
]

[tool.poetry]
packages = [{ include = "dizx", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
